services:
  # ── FastAPI AI Microservice ────────────────────────────────────────────────
  - type: web
    name: biteback-ai
    env: docker
    region: ohio
    plan: free
    dockerContext: ./ai-service
    dockerfilePath: ./ai-service/Dockerfile
    envVars:
      - key: PORT
        value: "8000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://bite-back-ai.vercel.app,https://biteback-backend.onrender.com
      - key: GEMINI_API_KEY
        sync: false # You will enter this manually in the Render Dashboard

  # ── Spring Boot Backend ────────────────────────────────────────────────────
  - type: web
    name: biteback-backend
    env: docker
    region: ohio
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_HOST
        fromDatabase:
          name: biteback-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: biteback-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: biteback-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: biteback-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: biteback-db
          property: password
      - key: JWT_SECRET
        generateValue: true # Render will auto-generate a secure random 256-bit string
      - key: AI_SERVICE_URL
        # Must match the name of the AI service above
        value: https://biteback-ai.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://bite-back-ai.vercel.app

databases:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  - name: biteback-db
    region: ohio
    plan: free
    databaseName: vestaai
    user: vestaai
