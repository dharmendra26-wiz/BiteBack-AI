spring.application.name=vesta-ai

# ─── H2 In-Memory Database (Demo — resets on restart by design) ─────────────
spring.datasource.url=jdbc:h2:mem:vesta_ai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ─── Server ─────────────────────────────────────────────────────────────────
# Railway injects PORT — must use it or health checks fail
server.port=${PORT:8080}

# ─── JWT ────────────────────────────────────────────────────────────────────
# Set JWT_SECRET as a Railway env var in production; falls back to dev value locally
jwt.secret=${JWT_SECRET:VestaAI_SuperSecret_Key_For_JWT_2024_Minimum256BitsLong_RandomString}
jwt.expiration=86400000

# ─── AI Microservice ─────────────────────────────────────────────────────────
# Set AI_SERVICE_URL to the FastAPI Railway URL in production
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# ─── CORS ─────────────────────────────────────────────────────────────────────
# Comma-separated list — set CORS_ALLOWED_ORIGINS in Railway to include Vercel URL
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
