spring.application.name=vesta-ai

# ─── Database ────────────────────────────────────────────────────────────────
# Set DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD as env vars in production.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vestaai}
spring.datasource.username=${DB_USER:vestaai}
spring.datasource.password=${DB_PASSWORD:vestaai_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema — never let Hibernate touch it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway migrations are in src/main/resources/db/migration/
spring.flyway.enabled=true

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:VestaAI_SuperSecret_Key_For_JWT_2024_Minimum256BitsLong_RandomString}
jwt.expiration=86400000

# ─── AI Microservice ─────────────────────────────────────────────────────────
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# ─── CORS ────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
