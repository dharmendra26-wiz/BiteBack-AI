spring.application.name=vesta-ai

# ─── Database ────────────────────────────────────────────────────────────────
# Set DATABASE_URL as a Render/Railway env var in production.
# Format: jdbc:postgresql://host:5432/dbname?user=xxx&password=yyy
# For local dev run with --spring.profiles.active=local (see application-local.properties)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema — never let Hibernate touch it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway migrations are in src/main/resources/db/migration/
spring.flyway.enabled=true

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:VestaAI_SuperSecret_Key_For_JWT_2024_Minimum256BitsLong_RandomString}
jwt.expiration=86400000

# ─── AI Microservice ─────────────────────────────────────────────────────────
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# ─── CORS ────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
