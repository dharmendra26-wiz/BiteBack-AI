# ─── Test profile — H2 in-memory, no Postgres needed ────────────────────────
# Auto-activated by: src/test/resources/application-test.properties
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests — Hibernate creates the schema from entities instead
spring.flyway.enabled=false

# Short JWT secret for tests (still ≥ 256 bits)
jwt.secret=TestSecretKeyForJwtThatIsLongEnoughFor256BitsHmacSHA
jwt.expiration=3600000

ai.service.url=http://localhost:8000
cors.allowed-origins=http://localhost:5173
